name: preview-alerts
on:
  workflow_dispatch:   # sends example alerts using live data; doesn't touch the tracker's state
    inputs:
      what:
        description: "all = one of every alert type; weekly = just the weekly report"
        default: all
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q matplotlib==3.11.2   # only used for the weekly chart
      - run: python tracker.py --preview ${{ inputs.what }}
        env: { TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}", TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}", MY_WALLET: "${{ secrets.MY_WALLET }}" }
