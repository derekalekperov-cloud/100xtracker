name: preview-alerts
on:
  workflow_dispatch:   # sends example alerts using live data; doesn't touch the tracker's state
    inputs:
      what:
        description: "all = one of every alert type; weekly = just the weekly report; status = health card; channel = test post to the subscriber channel"
        default: all
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4, pinned
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5, pinned
        with: { python-version: "3.12" }
      - run: pip install -q matplotlib==3.11.2   # only used for the weekly chart
      - run: python tracker.py --preview "$WHAT"
        env: { WHAT: "${{ inputs.what }}", TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}", TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}", MY_WALLET: "${{ secrets.MY_WALLET }}", PAID_CHAT_ID: "${{ secrets.PAID_CHAT_ID }}" }
