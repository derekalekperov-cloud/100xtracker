name: hyper-tracker
on:
  schedule:
    - cron: "*/5 * * * *"   # start a watcher; each run polls every minute for ~50 min
  workflow_dispatch:         # manual run also sends the daily summary (test message)
permissions:
  contents: write
concurrency:
  group: tracker             # only one watcher at a time; extra triggers wait in line
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Watch wallets (daily summary at 09:00 Madrid is sent automatically)
        run: python tracker.py --loop 50 ${{ github.event_name == 'workflow_dispatch' && '--daily' || '' }}
        env: { TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}", TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}", MY_WALLET: "${{ secrets.MY_WALLET }}" }
      - name: Save state
        if: always()
        run: |
          git config user.name tracker-bot && git config user.email tracker-bot@users.noreply.github.com
          git add state.json && git commit -m "state" -q || true
          git pull --rebase -X ours -q || true
          git push -q
