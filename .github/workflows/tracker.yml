name: hyper-tracker
on:
  schedule:
    - cron: "*/5 * * * *"   # backup starter; GitHub often runs this late or skips it
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = also send the weekly report now; watch = just watch"
        default: preview
permissions:
  contents: write
  actions: write             # lets each run start the next one (keeps it running 24/7)
concurrency:
  group: tracker             # only one watcher at a time; extra triggers wait in line
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q matplotlib==3.11.2 || true   # pinned; only for the weekly chart (text is sent if it fails)
      - name: Watch wallets every minute for ~50 min
        run: python tracker.py --loop 50 ${{ inputs.mode == 'preview' && '--weekly' || '' }}
        env: { TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}", TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}", MY_WALLET: "${{ secrets.MY_WALLET }}" }
      - name: Save state
        if: always()
        run: |
          git config user.name tracker-bot && git config user.email tracker-bot@users.noreply.github.com
          git add state.json && git commit -m "state" -q || true
          git pull --rebase -X ours -q || true
          git push -q
      - name: Start the next watcher
        if: always()
        run: for i in 1 2 3 4; do gh workflow run tracker.yml -f mode=watch && break; sleep $((i * 10)); done
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Tell me on Telegram if this run crashed
        if: failure()
        run: >
          curl -s -o /dev/null https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage
          --form-string chat_id="$TELEGRAM_CHAT_ID"
          --form-string text="⚠️ Tracker run crashed. The next run restarts it automatically within minutes. If you keep getting this, check: $RUN_URL"
        env: { TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}", TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}", RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
